version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Um PR por semana com todas as actions, em vez de um por action.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Era 100. Fila de PRs nao revisadas nao e cobertura, e ruido: cada PR
    # aberta dispara CI e deploy de preview.
    open-pull-requests-limit: 10

    # Cooldown: dias apos o release antes de abrir o PR. Da tempo da
    # comunidade encontrar regressao.
    # https://github.blog/changelog/2025-07-01-dependabot-supports-configuration-of-a-minimum-package-age/
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14

    # Majors travados por peer de terceiro. Verificado no registry em
    # 2026-09-04 contra a versao `latest` de cada dependente, nao a instalada.
    # Reavaliar quando o dependente publicar suporte; ao remover um ignore,
    # confirmar o peer de novo antes.
    ignore:
      # @shopify/shopify-app-session-storage-prisma@10.0.1 ainda declara
      # peer prisma/@prisma/client ^6.19.0. Prisma 7 rompe o peer.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # @vercel/react-router@1.3.6 fixa peer @react-router/dev e
      # @react-router/node no major '7'; @shopify/shopify-app-react-router@2.1.0
      # declara peer react-router ^7.6.2. React Router 8 rompe os dois.
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/dev'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/fs-routes'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/serve'
        update-types: ['version-update:semver-major']

    groups:
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite:
        patterns:
          - 'vite'
          - 'vite-tsconfig-paths'
      react-router:
        patterns:
          - '@react-router/dev'
          - '@react-router/fs-routes'
          - '@react-router/node'
          - '@react-router/serve'
          - 'react-router'
      # eslint-plugin e parser precisam sempre da MESMA major. Separados,
      # cada PR isolada estoura ERESOLVE no peer do outro.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      # Sem ignore de major: eslint 10 nao esta travado por peer de terceiro,
      # esta travado por trabalho nosso (migrar .eslintrc.cjs para flat config).
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

      # Todo patch que nao caiu em grupo acima vira um PR unico.
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
