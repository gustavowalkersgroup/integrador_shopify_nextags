name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um PR dispararia push (na branch) e pull_request, pagando duas vezes por
# commit. push fica restrito a main; runs superados na mesma ref sao cancelados.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Sem fail-fast: a falha de um Node nao deve apagar o sinal do outro.
      fail-fast: false
      matrix:
        # Somente 22 e 24. Node 20 nao instala: @vitest/istanbul-lib-coverage@1.0.1
        # exige node >=22 e, com engine-strict=true no .npmrc, npm ci aborta.
        # 23.x e 25.x ficam fora porque vitest@5 declara ^22.12.0 || ^24.0.0 || >=26.0.0.
        # O piso 22.18 vem de @shopify/polaris-types, que declara node >=22.18.0.
        # Mantenha esta matriz igual a engines.node do package.json.
        node: [22, 24]

    # Efemero, só pra este job: o schema (Task 2) usa Postgres via DATABASE_URL,
    # e os testes em tests/db/** fazem operacoes reais (unique constraint,
    # JSONB, etc.) contra ele. DATABASE_URL_TEST aponta pro mesmo banco —
    # e o que os arquivos de teste usam pra montar/limpar fixtures; DATABASE_URL
    # e o que o singleton em app/db.server.ts le.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextags_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextags_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/nextags_ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci, nao npm install: respeita o package-lock.json commitado e
      # falha se o lock estiver dessincronizado do package.json.
      - name: Install dependencies
        run: npm ci

      # Antes do typecheck: tsc depende dos tipos gerados de @prisma/client.
      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      # Cria as tabelas no Postgres efemero do job antes dos testes em tests/db/**.
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
