# This file stores configurations for your Shopify app.
client_id = ""
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_fulfillments,read_checkouts,read_products,read_inventory,read_customers"

[webhooks]
api_version = "2025-10"

  # Receptor unico: o roteamento por topic vive em app/lib/webhook-handler.server.ts
  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  topics = [
    "orders/paid",
    "orders/fulfilled",
    "orders/cancelled",
    "orders/updated",
    "fulfillments/create",
    "fulfillments/update",
    "refunds/create",
    "products/create",
    "products/update",
    "products/delete",
    "inventory_levels/update",
    "app/uninstalled",
  ]

  # Webhooks obrigatorios de compliance (GDPR) — mesma rota, tratados por app/lib/compliance.server.ts
  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify"
  compliance_topics = ["shop/redact"]
